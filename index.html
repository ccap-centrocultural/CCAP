<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCAP Centro Cultural</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f4f7;
      color: #222;
      line-height: 1.5;
    }
    header {
      background: #1f3b5c;
      color: #fff;
      text-align: center;
      padding: 32px 16px;
    }
    header h1 { font-size: 2rem; }
    header p { opacity: 0.85; margin-top: 6px; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    .imagenes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .imagenes img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      background: #ccc;
    }
    .contacto {
      background: #fff;
      margin-top: 32px;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .contacto h2 { color: #1f3b5c; margin-bottom: 16px; }
    .contacto p { margin: 8px 0; font-size: 1.05rem; }
    .contacto a { color: #1f6fb5; text-decoration: none; }
    .contacto a:hover { text-decoration: underline; }
    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- ====== TÍTULO: cambiá el texto entre las etiquetas ====== -->
  <header>
    <h1>CCAP Centro Cultural</h1>
    <p>Centro de iniciacion y actualizacion en oficios para emprendedores</p>
  </header>

  <main>
    <!-- ====== IMÁGENES: subí a GitHub dos fotos llamadas imagen1.jpg e imagen2.jpg ====== -->
    <section class="imagenes">
      <img src="imagen1.jpg" alt="Imagen 1">
      <img src="imagen2.jpg" alt="Imagen 2">
    </section>

    <!-- ====== CONTACTO: reemplazá los datos de ejemplo ====== -->
    <section class="contacto">
      <h2>Contacto</h2>
      <p><strong>Nombre:</strong> CCAP </p>
      <p><strong>Teléfono / WhatsApp:</strong> <a href="https://wa.me/5491170605736">+54 9 11 7060-5736</a></p>
      <p><strong>Email:</strong> <a href="mailto:ccapcentrocultural@hotmail.com">ccapcentrocultural@hotmail.com</a></p>
      <p><strong>Dirección:</strong> Granaderos 101, Ciudad de Pablo Nogues</p>
    </section>
  </main>

  <footer>
    © 2026 – CCAP Centro Cultural
  </footer>

</body>
</html>
